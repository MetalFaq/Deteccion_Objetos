[build-system]
requires = ["uv_build>=0.11.32,<0.13"]
build-backend = "uv_build"

[project]
name = "object-detection-template"
version = "0.1.0"
description = "Backend-agnostic Python template for object detection projects."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
ultralytics = [
  "ultralytics>=8.3",
]
ocr = [
  "pillow>=11,<13",
  "pytesseract>=0.3.13,<1",
]
onnx = [
  "onnxruntime>=1.20,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
object-detection = "object_detection_template.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".bootstrap_uv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
